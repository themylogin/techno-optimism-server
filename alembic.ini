# Alembic config for local development (`alembic revision --autogenerate`,
# `alembic upgrade head`). At runtime the app does NOT read this file: it builds
# the config in code (see techno_optimism_server.db.apply_migrations) and sets
# the URL from DB_PATH. Point the CLI at the same database here.
[alembic]
script_location = techno_optimism_server/migrations
sqlalchemy.url = sqlite:///voice-notes/db.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
